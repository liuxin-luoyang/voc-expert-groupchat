<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>职教办学专家群聊台</title>
<style>
  :root {
    --bg:#0f1420; --panel:#1a2233; --panel2:#131a2a; --line:#2a3550;
    --txt:#e8edf7; --dim:#9aa7c0; --acc:#4f8cff; --acc2:#25d3a3;
    --user:#4f8cff; --bot:#1f2b45; --lead:#7c5cff;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;
       background:var(--bg);color:var(--txt);height:100vh;display:flex;flex-direction:column;overflow:hidden}
  header{padding:14px 20px;background:var(--panel);border-bottom:1px solid var(--line);
         display:flex;align-items:center;gap:12px}
  header h1{font-size:18px;margin:0;font-weight:600}
  header .sub{font-size:12px;color:var(--dim)}
  #chat{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:14px}
  .msg{display:flex;gap:10px;max-width:88%}
  .msg.user{align-self:flex-end;flex-direction:row-reverse}
  .avatar{width:38px;height:38px;border-radius:9px;flex:0 0 38px;display:flex;align-items:center;
          justify-content:center;font-size:15px;font-weight:700;color:#fff;background:var(--acc)}
  .bubble{padding:10px 14px;border-radius:14px;line-height:1.6;font-size:14.5px;white-space:pre-wrap}
  .msg.user .bubble{background:var(--user);border-top-right-radius:3px}
  .msg.bot .bubble{background:var(--bot);border-top-left-radius:3px}
  .meta{font-size:11.5px;color:var(--dim);margin-bottom:4px}
  .badge{display:inline-block;font-size:11px;padding:1px 8px;border-radius:20px;
         background:#2a3550;color:#cdd8ef;margin-right:6px}
  .typing{color:var(--dim);font-size:13px}
  footer{padding:10px 16px;background:var(--panel);border-top:1px solid var(--line)}
  #composer{display:flex;gap:10px}
  #input{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--txt);
         padding:11px 14px;border-radius:12px;font-size:14.5px;resize:none;outline:none}
  #input:focus{border-color:var(--acc)}
  button{background:var(--acc);color:#fff;border:0;padding:11px 20px;border-radius:12px;
         font-size:14.5px;cursor:pointer;font-weight:600}
  button:disabled{opacity:.5;cursor:not-allowed}
  .hint{font-size:11px;color:var(--dim);margin-top:6px;padding:0 4px}
  .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);
         background:#3a1530;color:#ffb3c9;padding:8px 16px;border-radius:10px;font-size:13px;
         opacity:0;transition:opacity .3s;pointer-events:none;z-index:9}
  .toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <h1>职教办学专家群聊台</h1>
  <div class="sub">9 位职教专家协同 · 调度器自动路由 · 依据教职成〔2026〕1号</div>
</header>

<div id="chat"></div>

<footer>
  <div id="composer">
    <textarea id="input" rows="2" placeholder="向专家团提问，例如：帮我校做一个专业群建设规划"
      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea>
    <button id="btn" onclick="send()">发送</button>
  </div>
  <div class="hint">回车发送 / Shift+回车换行 · 调度器会自动指派最合适的专家回答</div>
</footer>
<div class="toast" id="toast"></div>

<script>
let CHARS = [];
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const btn = document.getElementById('btn');

async function loadChars(){
  try{
    const r = await fetch('./characters.json');
    CHARS = await r.json();
    welcome();
  }catch(e){
    toast('加载角色配置失败：'+e.message);
  }
}

function avatarBg(id){
  const map={lead:'#7c5cff','zhen-yexin':'#4f8cff','ke-pucheng':'#25d3a3','jiao-xincai':'#ff9f43',
    'shi-nengqing':'#e84393','geng-jilian':'#0abde3','rong-qitong':'#1dd1a1','lian-sushu':'#f6e58d',
    'qun-yugao':'#686de3','ping-zhiheng':'#ff6b6b'};
  return map[id]||'#4f8cff';
}
function avatarText(id){
  const c=CHARS.find(x=>x.id===id);
  return c? c.name.split('·')[0].slice(0,2):'?';
}
function addMsg(who,text,extra=''){
  const isUser=who==='user';
  const el=document.createElement('div');
  el.className='msg '+(isUser?'user':'bot');
  const id= isUser? 'user':who;
  const name= isUser? '我': (CHARS.find(c=>c.id===id)?.name||id);
  el.innerHTML = `<div class="avatar" style="background:${avatarBg(id)}">${avatarText(id)}</div>
    <div><div class="meta">${isUser?'': '<span class="badge">'+name+'</span>'} ${extra}</div>
    <div class="bubble"></div></div>`;
  el.querySelector('.bubble').textContent=text;
  chat.appendChild(el);
  chat.scrollTop=chat.scrollHeight;
  return el.querySelector('.bubble');
}
function welcome(){
  addMsg('lead',`你好，我是职教办学总策划「陶成蹊」。\n本群有 8 位领域专家协同在线。你可以直接提问，调度器会自动指派最合适的专家；也可以 @姓名 指定某位专家单独回答。\n\n覆盖领域：专业群建设、课程体系、新形态教材、双师师资、实训基地、校企协同、要素联动、集群培养、质量评价。`, '总策划');
}

async function send(){
  const text=input.value.trim();
  if(!text||btn.disabled)return;
  input.value='';
  addMsg('user',text);
  btn.disabled=true;

  // 1) 解析显式 @ 指定
  let target=null;
  const m=text.match(/@([\u4e00-\u9fa5·A-Za-z0-9]+)/);
  if(m){
    const want=m[1];
    const hit=CHARS.find(c=>c.id!=='scheduler'&&c.name.includes(want.replace('·','')));
    target= hit? hit.id : null;
  }

  // 2) 调度器路由（无显式 @ 时）
  if(!target){
    try{
      target=await route(text);
    }catch(e){ target='lead'; }
  }
  target=target||'lead';

  // 3) 让目标专家回答（流式）
  const char=CHARS.find(c=>c.id===target);
  const bubble=addMsg(target,'',char?char.name:'专家');
  const thinking=document.createElement('span');
  thinking.className='typing';thinking.textContent='正在思考…';
  bubble.innerHTML='';bubble.appendChild(thinking);
  chat.scrollTop=chat.scrollHeight;

  try{
    const r=await fetch('./api/chat',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:text,target:target,history:[...chatMsgs()]})
    });
    if(!r.ok){ throw new Error('HTTP '+r.status); }
    const reader=r.body.getReader();
    const dec=new TextDecoder();
    let buf='';
    thinking.remove();
    bubble.textContent='';
    while(true){
      const {done,value}=await reader.read();
      if(done)break;
      buf+=dec.decode(value,{stream:true});
      const lines=buf.split('\n');
      buf=lines.pop();
      for(const line of lines){
        if(!line.startsWith('data: '))continue;
        const payload=line.slice(6).trim();
        if(payload==='__END__')continue;
        try{
          const j=JSON.parse(payload);
          if(j.target){
            const c=CHARS.find(x=>x.id===j.target);
            const meta=bubble.parentElement.querySelector('.meta');
            meta.innerHTML='<span class="badge">'+(c?c.name:j.target)+'</span>';
          }
          if(j.delta)bubble.textContent+=j.delta;
        }catch(_){/* 忽略非 JSON 行 */}
      }
      chat.scrollTop=chat.scrollHeight;
    }
  }catch(e){
    thinking.remove();
    bubble.textContent='⚠️ 调用失败：'+e.message+'\n请确认已部署 Cloudflare Functions 并在环境变量配置 DASHSCOPE_API_KEY。';
  }
  btn.disabled=false;
}

async function route(text){
  const r=await fetch('./api/chat',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({message:text,target:'__route__',history:[...chatMsgs()]})
  });
  const data=await r.json();
  return data.target||'lead';
}

function chatMsgs(){
  // 取最近 8 条作为上下文
  const nodes=[...chat.querySelectorAll('.msg')];
  const out=[];
  for(const n of nodes.slice(-8)){
    const isUser=n.classList.contains('user');
    out.push({role:isUser?'user':'assistant',content:n.querySelector('.bubble').textContent});
  }
  return out;
}

function toast(t){
  const el=document.getElementById('toast');
  el.textContent=t;el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),3200);
}

loadChars();
</script>
</body>
</html>
