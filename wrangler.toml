# Cloudflare Pages 部署配置（职教专家群聊台）
name = "voc-expert-groupchat"
compatibility_date = "2024-09-23"
pages_build_output_dir = "."

# 构建命令：纯静态 + Functions，无需构建
pages_build = { command = "echo 'no build, static + functions'" }

[variables]
# 通义千问 API Key（阿里云百炼）。请在 Cloudflare 控制台 Pages -> Settings -> Environment variables 配置
# DASHSCOPE_API_KEY = "sk-xxxx"

# 也可在此处绑定其它 LLM key（按需启用）
# HUNYUAN_API_KEY = ""
# ARK_API_KEY = ""
